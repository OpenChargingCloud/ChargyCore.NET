name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout ChargyCore.NET
        uses: actions/checkout@v5
        with:
          path: ChargyCore.NET

      # ChargyCore.NET references Styx and Hermod as sibling directories,
      # exactly like Hermod itself references Styx.
      - name: Checkout Styx
        uses: actions/checkout@v5
        with:
          repository: Vanaheimr/Styx
          path: Styx

      - name: Checkout Hermod
        uses: actions/checkout@v5
        with:
          repository: Vanaheimr/Hermod
          path: Hermod

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: ChargyCore.NET
        run: dotnet restore ChargyCore.slnx

      - name: Build
        working-directory: ChargyCore.NET
        run: dotnet build ChargyCore.slnx --configuration Release --no-restore

      - name: Test
        working-directory: ChargyCore.NET
        run: >
          dotnet test ChargyCore.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=ChargyCoreTests.trx"
          --results-directory artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ChargyCore.NET/artifacts/**/*.trx

      # Not published anywhere: Styx and Hermod are not on nuget.org, so the
      # packages this produces cannot be installed from a public feed yet (see
      # the README). Packing anyway keeps the metadata honest — a broken
      # package description is found here rather than on release day.
      # Project by project rather than the whole solution: Styx and Hermod are in
      # the solution too, and packing them here would publish other people's
      # projects out of this repository's build.
      - name: Pack
        working-directory: ChargyCore.NET
        run: |
          dotnet pack ChargyCore/ChargyCore.csproj                 --configuration Release --no-build --output artifacts/packages
          dotnet pack ChargyCore.QRCodes/ChargyCore.QRCodes.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ChargyCore.NET/artifacts/packages/*.*nupkg
